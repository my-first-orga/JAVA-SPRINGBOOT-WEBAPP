version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo Build started on `date`
      - mvn --version

      - echo Logging into ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 117327731569.dkr.ecr.us-east-1.amazonaws.com


  build:
    commands:
      - echo Building JAR file...
      - mvn clean package

      - echo Running SonarQube analysis...
      - mvn sonar:sonar -Dsonar.host.url=http://3.91.83.129:9000 -Dsonar.login=squ_aae6d693b7cc8900595505d5d18c7f28880acd18

      - echo Building Docker image...
      - docker build -t image-repo:latest .

      - docker tag image-repo:latest 117327731569.dkr.ecr.us-east-1.amazonaws.com/image-repo:latest



  post_build:
    commands:
      - echo Uploading JAR to S3...
      - aws s3 cp target/*.jar s3://awzn-s3-codebuild-bkt/

artifacts:
  files:
    - target/*.jar
