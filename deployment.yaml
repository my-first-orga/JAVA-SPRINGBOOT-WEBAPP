apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-deployment
  labels:
    app: image-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-app
  template:
    metadata:
      labels:
        app: image-app
    spec:
      containers:
      - name: image-container
        image: venkat956/image:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1 
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: image-app
  ports:
  - port: 80
    targetPort: 8080
 
