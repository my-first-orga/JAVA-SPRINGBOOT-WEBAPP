version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo Build started on `date`
      - mvn --version

  build:
    commands:
      - echo Building JAR file...
      - mvn clean package

      - echo Running SonarQube analysis...
      - mvn sonar:sonar -Dsonar.host.url=http://3.91.83.129:9000 -Dsonar.login=squ_aae6d693b7cc8900595505d5d18c7f28880acd18


  post_build:
    commands:
      - echo Uploading JAR to S3...
      - aws s3 cp target/*.jar s3://awzn-s3-codebuild-bkt/

artifacts:
  files:
    - target/*.jar
