version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo Build started on `date`
      - mvn --version

  build:
    commands:
      - echo Building JAR file...
      - mvn clean package

  post_build:
    commands:
      - echo Uploading JAR to S3...
      - aws s3 cp target/*.jar s3://awzn-s3-codebuild-bkt/

artifacts:
  files:
    - target/*.jar
