apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: argo-cd

  template:
    metadata:
      labels:
        app: argo-cd

    spec:
      containers:
        - name: cont-1
          image: nginx
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: svc-argo

spec:
  selector:
    app: argo-cd
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
